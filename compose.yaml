services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://portfolio:development@db/portfolio_development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
